<!doctype html><meta charset="utf-8"><title>Aperçu GLB</title>
<style>html,body{margin:0;background:#15131c;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/three.module.js","three/addons/":"/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);

      const c = o.geometry.attributes.color, W = new THREE.Color(0xc8b596), R = new THREE.Color(0x7a2e2a), roles = { 0.8: W, 0.6: R, 0.4: new THREE.Color(0x3f5b72) };
      const out = new Float32Array(c.count * 3);

    }

  if (cn) { const c = g.animations.find(a => a.name === cn); if (c) { const a = mx.clipAction(c); a.play(); mx.setTime(t); } }

</script>
