plugins { id 'com.android.application' }

// Signature de publication : lue depuis des variables d'environnement (secrets GitHub), jamais écrite dans le dépôt.
def ks = System.getenv('KORVALUNE_KEYSTORE')

android {
    namespace 'com.korvalune.game'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.korvalune.game'
        minSdk 26
        targetSdk 36
        versionCode 1065
        versionName '10.65.0'
    }
    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KORVALUNE_STORE_PASSWORD')
                keyAlias System.getenv('KORVALUNE_KEY_ALIAS')
                keyPassword System.getenv('KORVALUNE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
