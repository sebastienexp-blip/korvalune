# Déploiement en un clic sur Render (https://render.com) : « New + » > « Blueprint »
services:
  - type: web
    name: korvalune
    runtime: docker
    plan: starter          # un disque persistant exige un plan payant
    healthCheckPath: /healthz
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /data
      - key: SESSION_SECRET
        generateValue: true
      # Dons PayPal (voir DONS-PAYPAL.md) : nom(s) du/des compte(s) créateur autorisés à valider les dons, séparés par des virgules
      # Nom de domaine officiel du site vitrine (voir DOMAINE.md), ex. korvalune.fr — laisser vide tant qu'il n'est pas branché
      - key: PUBLIC_HOST
        sync: false
      - key: OWNER_ACCOUNTS
        sync: false
    disk:
      name: aetheria-data
      mountPath: /data
      sizeGB: 1
