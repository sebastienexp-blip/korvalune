# Déploiement en un clic sur Render (https://render.com) : « New + » > « Blueprint »
services:
  - type: web
    name: korvalune
    runtime: docker
    plan: starter          # un disque persistant exige un plan payant
    healthCheckPath: /healthz
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /data
      - key: SESSION_SECRET
        generateValue: true
      # Paiements Stripe (voir STRIPE.md) : à renseigner dans le tableau de bord Render, jamais dans ce fichier
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
    disk:
      name: aetheria-data
      mountPath: /data
      sizeGB: 1
