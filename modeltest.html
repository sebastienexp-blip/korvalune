<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Korvalune — Zone de test des modèles 3D</title>
<style>
  html,body{margin:0;height:100%;background:#16141d;color:#d9d4e8;font:14px system-ui,sans-serif;overflow:hidden;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;left:10px;top:10px;max-width:min(420px,90vw);background:#0009;padding:8px 10px;border-radius:8px;line-height:1.45}
  #hud b{color:#b9a6ff}
  #pad{position:fixed;left:14px;bottom:14px;width:130px;height:130px;border-radius:50%;background:#ffffff14;border:1px solid #ffffff30}
  #stick{position:absolute;left:45px;top:45px;width:40px;height:40px;border-radius:50%;background:#b9a6ffaa}
  #btns{position:fixed;right:12px;bottom:14px;display:grid;grid-template-columns:repeat(3,64px);gap:8px}
  #btns button{height:54px;border:1px solid #ffffff33;border-radius:10px;background:#2a2640cc;color:#eee;font:13px system-ui}
</style>
</head>
<body>
<div id="hud">Chargement du modèle…</div>
<div id="pad"><div id="stick"></div></div>
<div id="btns">
  <button data-a="attack">Attaque</button><button data-a="attack2">Attaque 2</button><button data-a="hit">Coup reçu</button>
  <button data-a="jump">Saut</button><button data-a="death">Mort</button><button data-a="run">Courir</button>
</div>
<script type="module" src="/src/dev/ModelTest.js"></script>
</body>
</html>
