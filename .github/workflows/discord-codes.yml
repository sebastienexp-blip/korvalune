name: Publier des codes cadeaux sur Discord

on:
  workflow_dispatch:
    inputs:
      codes:
        description: 'Codes à publier (JSON : [{"code","label"}])'
        required: true

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Publier les codes
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          PROMO_CODES: ${{ inputs.codes }}
        run: node tools/discord/post-codes.mjs
