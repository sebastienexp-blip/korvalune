# Fly.io : fly launch --no-deploy --copy-config ; fly volumes create aetheria_data --size 1 ; fly secrets set SESSION_SECRET=$(openssl rand -hex 32) ; fly deploy
app = "korvalune"
primary_region = "cdg"

[build]

[env]
  PORT = "8787"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"

[mounts]
  source = "aetheria_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.checks]
    path = "/healthz"
